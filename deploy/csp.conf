# CSP des pages et assets statiques (pas sur /api : elle casserait l'aperçu PDF des pièces).
# style-src 'unsafe-inline' : attributs style de React ; polices Google chargées depuis index.html.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
